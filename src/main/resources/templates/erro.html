<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<main id="conteudo" class="container formulario-container">
    <p class="sobretitulo" th:text="'Erro ' + ${codigo}"></p>
    <h1 th:text="${titulo}">Não foi possível concluir a operação</h1>

    <a class="botao" th:href="@{/}">Voltar ao início</a>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
