<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<main id="conteudo" class="container">
    <div class="titulo-acoes">
        <div><p class="sobretitulo">Cadastro</p><h1>Clientes</h1></div>
        <a class="botao" th:href="@{/clientes/novo}">Cadastrar cliente</a>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <p class="vazio" th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado. Cadastre o primeiro cliente para registrar um atendimento.</p>
    <div class="tabela-container" th:unless="${#lists.isEmpty(clientes)}">
        <table>
            <caption class="visualmente-oculto">Clientes cadastrados na DimDim</caption>
            <thead><tr><th scope="col">ID</th><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Telefone</th><th scope="col">Ações</th></tr></thead>
            <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}"></td>
                <th scope="row"><a th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.nome}"></a></th>
                <td th:text="${cliente.email}"></td>
                <td th:text="${#strings.isEmpty(cliente.telefone) ? 'Não informado' : cliente.telefone}"></td>
                <td class="acoes">
                    <a th:href="@{/clientes/{id}(id=${cliente.id})}" th:aria-label="'Ver detalhes de ' + ${cliente.nome}">Detalhes</a>
                    <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" th:aria-label="'Editar ' + ${cliente.nome}">Editar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
