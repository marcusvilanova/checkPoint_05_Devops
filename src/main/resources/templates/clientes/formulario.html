<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<main id="conteudo" class="container formulario-container">
    <a class="voltar" th:href="@{/clientes}">← Clientes</a>
    <h1 th:text="${titulo}">Cadastrar cliente</h1>
    <p>Os campos marcados com * são obrigatórios.</p>
    <form th:action="${registroId == null} ? @{/clientes} : @{/clientes/{id}(id=${registroId})}"
          th:object="${cliente}" method="post" class="formulario">
        <div th:if="${#fields.hasAnyErrors()}" class="aviso falha" role="alert">
            <p>Revise os campos indicados e tente salvar novamente.</p>
            <ul th:if="${#fields.hasGlobalErrors()}"><li th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></li></ul>
        </div>
        <div class="campo">
            <label for="nome">Nome completo *</label>
            <input id="nome" type="text" th:field="*{nome}" maxlength="150" required autocomplete="name"
                   th:attr="aria-invalid=${#fields.hasErrors('nome')}" aria-describedby="nome-erro">
            <p id="nome-erro" class="erro-campo" th:errors="*{nome}"></p>
        </div>
        <div class="campo">
            <label for="email">E-mail *</label>
            <input id="email" type="email" th:field="*{email}" maxlength="150" required autocomplete="email"
                   th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="email-erro">
            <p id="email-erro" class="erro-campo" th:errors="*{email}"></p>
        </div>
        <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="tel" th:field="*{telefone}" maxlength="20" autocomplete="tel"
                   th:attr="aria-invalid=${#fields.hasErrors('telefone')}" aria-describedby="telefone-ajuda telefone-erro">
            <p id="telefone-ajuda" class="ajuda">Opcional. Exemplo: (11) 99999-0000.</p>
            <p id="telefone-erro" class="erro-campo" th:errors="*{telefone}"></p>
        </div>
        <div class="botoes">
            <button type="submit">Salvar cliente</button>
            <a class="botao secundario" th:href="${registroId == null} ? @{/clientes} : @{/clientes/{id}(id=${registroId})}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
